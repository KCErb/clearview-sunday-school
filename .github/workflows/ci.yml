name: CI
on:
  pull_request:
  workflow_call:
    inputs:
      preview:
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_POLL_PREVIEW: ${{ inputs.preview && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify migration and authorization
        env:
          PGPASSWORD: local-test-only
        run: >-
          psql -h localhost -U postgres -d postgres -X -v ON_ERROR_STOP=1
          -f tests/postgres-bootstrap.sql
          -f supabase/migrations/0016_polling_rewrite.sql
          -f supabase/migrations/0017_private_write_ins.sql
          -f supabase/migrations/0018_decks.sql
          -f supabase/migrations/0019_deck_covers.sql
          -f supabase/tests/polling.sql
          -f supabase/tests/write_ins.sql
          -f supabase/tests/decks.sql
