<!doctype html><html><head><meta charset="utf-8"><title>Forms</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-serif-text)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:16px}.col{display:flex;flex-direction:column;gap:16px}.lbl{font-family:var(--font-sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-quiet);margin-bottom:8px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.LatterDaySaintsDesignSystem_88d7f2;
function Demo(){const [c,setC]=React.useState(true),[r,setR]=React.useState('Sunday School'),[s,setS]=React.useState(true);
 return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
  <div className="col"><Input label="Lesson title" defaultValue="The Good Shepherd" hint="Shown on the opening slide"/>
   <Input label="Reference" defaultValue="John 10" error="Add a verse range"/></div>
  <div className="col"><Select label="Class" options={['Sunday School','Youth','Primary']}/>
   <Checkbox label="Include verse numbers" description="Applies to every scripture slide" checked={c} onChange={setC}/>
   <Radio name="cls" options={['Sunday School','Youth']} value={r} onChange={setR}/>
   <Switch label="Reverent theme" checked={s} onChange={setS}/></div>
 </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
