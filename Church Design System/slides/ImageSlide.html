<!-- @dsCard group="Slides" viewport="1280x720" name="Full-bleed image" subtitle="Side scrim protects the title; artwork credit required" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--neutral-20);overflow:hidden}
.stage{width:1280px;height:720px;overflow:hidden}
.slide{width:1920px;height:1080px;transform:scale(.6666667);transform-origin:top left;position:relative;box-sizing:border-box;padding:var(--slide-margin-y) var(--slide-margin-x);background:var(--slide-bg);color:var(--slide-ink);font-family:var(--font-serif-display);display:flex;flex-direction:column}
.dark{background:var(--slide-bg-accent);color:var(--slide-ink-invert);--heading-ink:var(--slide-ink-invert)}
.eyebrow{font-family:var(--font-sans);font-size:24px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.dark .eyebrow{color:rgba(255,255,255,.72)}
.rule{width:120px;height:5px;background:var(--slide-rule);border:0;margin:0}
.title{font-size:var(--fs-slide-title);line-height:1.08;letter-spacing:-.015em;font-weight:600;margin:0;text-wrap:pretty}
.display{font-size:var(--fs-slide-display);line-height:1.05;letter-spacing:-.02em;font-weight:600;margin:0;text-wrap:pretty}
.body{font-size:var(--fs-slide-body);line-height:1.5;font-family:var(--font-serif-text);max-width:52ch}
.cap{font-family:var(--font-sans);font-size:var(--fs-slide-caption);color:var(--text-muted)}
.dark .cap{color:rgba(255,255,255,.72)}
.dark .rule{background:var(--slide-rule-invert)}
.mark{font-family:var(--font-serif-display);line-height:1.22;text-align:center}
.mark .s{font-size:20px;letter-spacing:.06em;opacity:.7}.mark .m{font-size:38px;font-weight:600}
.ph{background:repeating-linear-gradient(45deg,var(--neutral-10),var(--neutral-10) 14px,var(--neutral-20) 14px,var(--neutral-20) 28px);display:flex;align-items:center;justify-content:center;color:var(--text-quiet);font-family:var(--font-sans);font-size:22px;letter-spacing:.1em;text-transform:uppercase}
.spacer{flex:1}</style></head><body><div class="stage"><div class="slide" style="padding:0">
<div class="ph" style="position:absolute;inset:0">Drop artwork here</div>
<div style="position:absolute;inset:0;background:var(--scrim-full)"></div>
<div style="position:absolute;left:var(--slide-margin-x);top:50%;transform:translateY(-50%);color:#fff;--heading-ink:#fff;max-width:24ch">
<div class="eyebrow" style="color:rgba(255,255,255,.75)">Consider</div>
<h2 class="title" style="margin-top:28px">He knows each of us by name.</h2></div>
<div style="position:absolute;left:var(--slide-margin-x);bottom:48px;font-family:var(--font-sans);font-size:20px;font-style:italic;color:rgba(255,255,255,.78)">Artwork credit goes here — title, artist, year.</div>
</div></div></body></html>
