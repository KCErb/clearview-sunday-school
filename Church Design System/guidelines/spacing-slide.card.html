<!doctype html><html><head><meta charset="utf-8"><title>Slide margins</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;gap:0;border-radius:4px;overflow:hidden;border:1px solid var(--border-subtle)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.k{font-size:11px;color:var(--text-quiet);letter-spacing:.1em;text-transform:uppercase}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--text-muted)}
.r{display:flex;align-items:baseline;gap:14px}</style></head><body><div style="position:relative;width:100%;aspect-ratio:16/9;max-height:160px;background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:4px">
<div style="position:absolute;inset:7.4% 5.8%;border:1px dashed var(--blue-20);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--blue-30)">safe area · 1696 × 920</div></div>
<div class="mono" style="margin-top:10px">--slide-margin-x 112px · --slide-margin-y 80px · --slide-gutter 48px</div></body></html>
