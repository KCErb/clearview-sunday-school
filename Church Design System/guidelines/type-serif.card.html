<!doctype html><html><head><meta charset="utf-8"><title>Serif</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;gap:0;border-radius:4px;overflow:hidden;border:1px solid var(--border-subtle)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.k{font-size:11px;color:var(--text-quiet);letter-spacing:.1em;text-transform:uppercase}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--text-muted)}
.r{display:flex;align-items:baseline;gap:14px}</style></head><body><div style="font-family:var(--font-serif-display);color:var(--text-heading)">
<div style="font-size:44px;line-height:1.1;letter-spacing:-.015em">Know His voice</div>
<div style="font-size:28px;line-height:1.2;font-weight:600;margin-top:10px">By small and simple things</div>
<div style="font-size:19px;line-height:1.6;color:var(--text-body);margin-top:10px;font-style:italic">Great things are brought to pass.</div>
<div class="mono" style="margin-top:10px">--font-serif-display · Source Serif 4 substituting for McKay Pro</div></div></body></html>
