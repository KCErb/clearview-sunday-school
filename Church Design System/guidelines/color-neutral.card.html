<!doctype html><html><head><meta charset="utf-8"><title>Neutral</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;gap:0;border-radius:4px;overflow:hidden;border:1px solid var(--border-subtle)}
.sw>div{flex:1;height:62px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:10px;letter-spacing:.03em}
.sw .h{font-family:ui-monospace,Menlo,monospace;opacity:.85}
.k{font-size:11px;color:var(--text-quiet);letter-spacing:.1em;text-transform:uppercase}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-muted)}</style></head><body><div class="sw"><div style="background:var(--neutral-5);color:#000"><span>5</span><span class="h">#EFEFE7</span></div><div style="background:var(--neutral-10);color:#000"><span>10</span><span class="h">#E9E6E0</span></div><div style="background:var(--neutral-15);color:#000"><span>15</span><span class="h">#E9E3D9</span></div><div style="background:var(--neutral-20);color:#000"><span>20</span><span class="h">#D5CFBE</span></div><div style="background:var(--neutral-25);color:#000"><span>25</span><span class="h">#C8C0AB</span></div><div style="background:var(--neutral-30);color:#000"><span>30</span><span class="h">#C6BFAD</span></div><div style="background:var(--neutral-35);color:#000"><span>35</span><span class="h">#BEB097</span></div><div style="background:var(--neutral-40);color:#000"><span>40</span><span class="h">#B3A18D</span></div></div></body></html>
