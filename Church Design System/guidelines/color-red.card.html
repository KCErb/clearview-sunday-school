<!-- @dsCard group="Colors" viewport="700x120" name="Red" subtitle="Use sparingly; 35 and 40 carry text contrast" -->
<!doctype html><html><head><meta charset="utf-8"><title>Red</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;gap:0;border-radius:4px;overflow:hidden;border:1px solid var(--border-subtle)}
.sw>div{flex:1;height:62px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:10px;letter-spacing:.03em}
.sw .h{font-family:ui-monospace,Menlo,monospace;opacity:.85}
.k{font-size:11px;color:var(--text-quiet);letter-spacing:.1em;text-transform:uppercase}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-muted)}</style></head><body><div class="sw"><div style="background:var(--red-5);color:#000"><span>5</span><span class="h">#FDA1B2</span></div><div style="background:var(--red-10);color:#000"><span>10</span><span class="h">#FC4E6D</span></div><div style="background:var(--red-15);color:#fff"><span>15</span><span class="h">#E10F5A</span></div><div style="background:var(--red-20);color:#fff"><span>20</span><span class="h">#BD0057</span></div><div style="background:var(--red-25);color:#fff"><span>25</span><span class="h">#A6004E</span></div><div style="background:var(--red-30);color:#fff"><span>30</span><span class="h">#8F124A</span></div><div style="background:var(--red-35);color:#fff"><span>35</span><span class="h">#7D003F</span></div><div style="background:var(--red-40);color:#fff"><span>40</span><span class="h">#6E0D33</span></div></div></body></html>
