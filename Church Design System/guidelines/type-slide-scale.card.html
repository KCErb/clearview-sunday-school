<!-- @dsCard group="Type" viewport="700x210" name="Slide type scale" subtitle="1920×1080 sizes — nothing below 24px" -->
<!doctype html><html><head><meta charset="utf-8"><title>Slide scale</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;gap:0;border-radius:4px;overflow:hidden;border:1px solid var(--border-subtle)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.k{font-size:11px;color:var(--text-quiet);letter-spacing:.1em;text-transform:uppercase}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--text-muted)}
.r{display:flex;align-items:baseline;gap:14px}</style></head><body><div style="font-family:var(--font-serif-display);color:var(--text-heading);transform-origin:left top;transform:scale(.42);width:1560px">
<div style="font-size:var(--fs-slide-display);line-height:1.1;margin-bottom:10px">88 Display</div><div style="font-size:var(--fs-slide-title);line-height:1.1;margin-bottom:10px">64 Title</div><div style="font-size:var(--fs-slide-head);line-height:1.1;margin-bottom:10px">44 Head</div><div style="font-size:var(--fs-slide-body);line-height:1.1;margin-bottom:10px">32 Body</div><div style="font-size:var(--fs-slide-caption);line-height:1.1;margin-bottom:10px">24 Caption</div></div></body></html>
