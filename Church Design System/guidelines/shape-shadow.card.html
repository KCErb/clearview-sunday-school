<!doctype html><html><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}

.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.k{font-size:11px;color:var(--text-quiet);letter-spacing:.1em;text-transform:uppercase}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--text-muted)}
.r{display:flex;align-items:baseline;gap:14px}</style></head><body><div style="display:flex;gap:18px;padding:8px">
<div style="text-align:center"><div style="width:108px;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:6px;box-shadow:var(--shadow-none)"></div><div class="mono" style="margin-top:8px">flat</div></div><div style="text-align:center"><div style="width:108px;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:6px;box-shadow:var(--shadow-xs)"></div><div class="mono" style="margin-top:8px">xs</div></div><div style="text-align:center"><div style="width:108px;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:6px;box-shadow:var(--shadow-sm)"></div><div class="mono" style="margin-top:8px">raised</div></div><div style="text-align:center"><div style="width:108px;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:6px;box-shadow:var(--shadow-md)"></div><div class="mono" style="margin-top:8px">floating</div></div><div style="text-align:center"><div style="width:108px;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:6px;box-shadow:var(--shadow-lg)"></div><div class="mono" style="margin-top:8px">overlay</div></div></div></body></html>
