<!-- @dsCard group="Colors" viewport="700x150" name="Protection scrims" subtitle="Deep-blue gradients that keep type legible over imagery" -->
<!doctype html><html><head><meta charset="utf-8"><title>Scrims</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;gap:0;border-radius:4px;overflow:hidden;border:1px solid var(--border-subtle)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.k{font-size:11px;color:var(--text-quiet);letter-spacing:.1em;text-transform:uppercase}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--text-muted)}
.r{display:flex;align-items:baseline;gap:14px}</style></head><body><div class="grid" style="grid-template-columns:1fr 1fr">
<div style="position:relative;height:110px;border-radius:4px;overflow:hidden;background:var(--neutral-25)"><div style="position:absolute;inset:0;background:var(--scrim-bottom)"></div><div style="position:absolute;left:14px;bottom:12px;color:#fff;font-family:var(--font-serif-display);font-size:20px">Bottom scrim</div></div>
<div style="position:relative;height:110px;border-radius:4px;overflow:hidden;background:var(--neutral-25)"><div style="position:absolute;inset:0;background:var(--scrim-full)"></div><div style="position:absolute;left:14px;top:14px;color:#fff;font-family:var(--font-serif-display);font-size:20px">Side scrim</div></div>
</div></body></html>
