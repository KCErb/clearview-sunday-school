<!doctype html><html><head><meta charset="utf-8"><title>Gray</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;gap:0;border-radius:4px;overflow:hidden;border:1px solid var(--border-subtle)}
.sw>div{flex:1;height:62px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:10px;letter-spacing:.03em}
.sw .h{font-family:ui-monospace,Menlo,monospace;opacity:.85}
.k{font-size:11px;color:var(--text-quiet);letter-spacing:.1em;text-transform:uppercase}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-muted)}</style></head><body><div class="sw"><div style="background:var(--gray-5);color:#000"><span>5</span><span class="h">#E0E2E2</span></div><div style="background:var(--gray-10);color:#000"><span>10</span><span class="h">#D0D3D3</span></div><div style="background:var(--gray-15);color:#000"><span>15</span><span class="h">#BDC0C0</span></div><div style="background:var(--gray-20);color:#000"><span>20</span><span class="h">#A9ADAD</span></div><div style="background:var(--gray-25);color:#000"><span>25</span><span class="h">#9DA1A1</span></div><div style="background:var(--gray-30);color:#fff"><span>30</span><span class="h">#878A8C</span></div><div style="background:var(--gray-35);color:#fff"><span>35</span><span class="h">#676B6E</span></div><div style="background:var(--gray-40);color:#fff"><span>40</span><span class="h">#53575B</span></div><div style="background:var(--gray-50);color:#fff"><span>50</span><span class="h">#35383A</span></div><div style="background:var(--black);color:#fff"><span>Black</span><span class="h">#000000</span></div></div></body></html>
