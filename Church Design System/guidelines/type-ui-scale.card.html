<!doctype html><html><head><meta charset="utf-8"><title>UI scale</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;gap:0;border-radius:4px;overflow:hidden;border:1px solid var(--border-subtle)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.k{font-size:11px;color:var(--text-quiet);letter-spacing:.1em;text-transform:uppercase}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--text-muted)}
.r{display:flex;align-items:baseline;gap:14px}</style></head><body><div style="color:var(--text-heading)">
<div class="r"><span style="font-size:var(--fs-h1);font-family:var(--font-serif-display);line-height:1.3">40 H1</span><span class="mono">--fs-h1</span></div><div class="r"><span style="font-size:var(--fs-h2);font-family:var(--font-serif-display);line-height:1.3">30 H2</span><span class="mono">--fs-h2</span></div><div class="r"><span style="font-size:var(--fs-h3);font-family:var(--font-serif-display);line-height:1.3">24 H3</span><span class="mono">--fs-h3</span></div><div class="r"><span style="font-size:var(--fs-body-lg);font-family:var(--font-serif-text);line-height:1.3">19 Body large</span><span class="mono">--fs-body-lg</span></div><div class="r"><span style="font-size:var(--fs-body);font-family:var(--font-serif-text);line-height:1.3">17 Body</span><span class="mono">--fs-body</span></div><div class="r"><span style="font-size:var(--fs-body-sm);font-family:var(--font-sans);line-height:1.3">15 Body small</span><span class="mono">--fs-body-sm</span></div><div class="r"><span style="font-size:var(--fs-caption);font-family:var(--font-sans);line-height:1.3">13 Caption</span><span class="mono">--fs-caption</span></div></div></body></html>
