<!-- @dsCard group="Colors" viewport="700x160" name="Semantic aliases" subtitle="What to reach for instead of a raw swatch" -->
<!doctype html><html><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;gap:0;border-radius:4px;overflow:hidden;border:1px solid var(--border-subtle)}
.sw>div{flex:1;height:62px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:10px;letter-spacing:.03em}
.sw .h{font-family:ui-monospace,Menlo,monospace;opacity:.85}
.k{font-size:11px;color:var(--text-quiet);letter-spacing:.1em;text-transform:uppercase}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div><div style="height:40px;border-radius:4px;border:1px solid var(--border-subtle);background:var(--text-heading)"></div><div class="mono" style="margin-top:6px">--text-heading</div><div class="k">Heading ink · Black</div></div><div><div style="height:40px;border-radius:4px;border:1px solid var(--border-subtle);background:var(--text-body)"></div><div class="mono" style="margin-top:6px">--text-body</div><div class="k">Body ink · Gray 40</div></div><div><div style="height:40px;border-radius:4px;border:1px solid var(--border-subtle);background:var(--accent)"></div><div class="mono" style="margin-top:6px">--accent</div><div class="k">Accent · Blue 25</div></div><div><div style="height:40px;border-radius:4px;border:1px solid var(--border-subtle);background:var(--focus-ring)"></div><div class="mono" style="margin-top:6px">--focus-ring</div><div class="k">Focus ring · Gold 20</div></div><div><div style="height:40px;border-radius:4px;border:1px solid var(--border-subtle);background:var(--surface-page)"></div><div class="mono" style="margin-top:6px">--surface-page</div><div class="k">Page · Neutral 5</div></div><div><div style="height:40px;border-radius:4px;border:1px solid var(--border-subtle);background:var(--surface-card)"></div><div class="mono" style="margin-top:6px">--surface-card</div><div class="k">Card · White</div></div><div><div style="height:40px;border-radius:4px;border:1px solid var(--border-subtle);background:var(--surface-warm)"></div><div class="mono" style="margin-top:6px">--surface-warm</div><div class="k">Warm · Gold 10 20%</div></div><div><div style="height:40px;border-radius:4px;border:1px solid var(--border-subtle);background:var(--surface-accent)"></div><div class="mono" style="margin-top:6px">--surface-accent</div><div class="k">Reverent · Blue 40</div></div>
</div></body></html>
