<!doctype html><html><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}

.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px;font-size:10px;letter-spacing:.04em}
.grid{display:grid;gap:10px}
.k{font-size:11px;color:var(--text-quiet);letter-spacing:.1em;text-transform:uppercase}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--text-muted)}
.r{display:flex;align-items:baseline;gap:14px}</style></head><body><div style="display:flex;gap:14px">
<div style="text-align:center"><div style="width:72px;height:52px;background:var(--blue-tint-20);border:1px solid var(--blue-15);border-radius:var(--radius-xs)"></div><div class="mono" style="margin-top:6px">xs</div></div><div style="text-align:center"><div style="width:72px;height:52px;background:var(--blue-tint-20);border:1px solid var(--blue-15);border-radius:var(--radius-sm)"></div><div class="mono" style="margin-top:6px">sm</div></div><div style="text-align:center"><div style="width:72px;height:52px;background:var(--blue-tint-20);border:1px solid var(--blue-15);border-radius:var(--radius-md)"></div><div class="mono" style="margin-top:6px">md</div></div><div style="text-align:center"><div style="width:72px;height:52px;background:var(--blue-tint-20);border:1px solid var(--blue-15);border-radius:var(--radius-lg)"></div><div class="mono" style="margin-top:6px">lg</div></div><div style="text-align:center"><div style="width:72px;height:52px;background:var(--blue-tint-20);border:1px solid var(--blue-15);border-radius:var(--radius-xl)"></div><div class="mono" style="margin-top:6px">xl</div></div><div style="text-align:center"><div style="width:72px;height:52px;background:var(--blue-tint-20);border:1px solid var(--blue-15);border-radius:var(--radius-pill)"></div><div class="mono" style="margin-top:6px">pill</div></div></div></body></html>
